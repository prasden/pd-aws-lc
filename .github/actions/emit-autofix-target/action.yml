name: 'emit-autofix-target'
description: 'Upload the (integration, version) pair of a failed integration job for autofix to consume.'
inputs:
  integration:
    description: 'Integration name (matches the *_patch directory).'
    required: true
  version:
    description: 'Version/branch the runner ran with (empty for flat patch dirs).'
    required: false
    default: ''
  artifact-suffix:
    description: 'Unique suffix for the artifact name to avoid collisions across matrix entries.'
    required: true
runs:
  using: 'composite'
  steps:
    - shell: bash
      run: printf '%s\t%s\n' "${{ inputs.integration }}" "${{ inputs.version }}" > autofix-target.txt
    - uses: actions/upload-artifact@v4
      with:
        name: autofix-target-${{ inputs.artifact-suffix }}
        path: autofix-target.txt
