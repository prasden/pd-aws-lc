name: autofix

on:
  workflow_run:
    workflows: [integration-omnibus]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: ID of a failed integration-omnibus run to repair
        required: true

permissions:
  contents: read

env:
  TARGET_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
  WORK_DIR: ${{ github.workspace }}/autofix-work

jobs:
  get-failing-integrations:
    name: get-failing-integrations
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r tests/ci/integration/autofix/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          pattern: integration-failure-*
          path: autofix-reports
          run-id: ${{ env.TARGET_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Find the commit the omnibus tested
        id: omnibus
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID" --jq .head_sha)" >> "$GITHUB_OUTPUT"
      - name: List the failing targets
        id: targets
        working-directory: tests/ci/integration
        env:
          AWSLC_SHA: ${{ steps.omnibus.outputs.sha }}
        run: echo "targets=$(python -m autofix recognize "$GITHUB_WORKSPACE/autofix-reports")" >> "$GITHUB_OUTPUT"
      # Save each failed job's log, stripped to plain ASCII, under its target for that target's reason job.
      - name: Download the failed job logs
        env:
          GH_TOKEN: ${{ github.token }}
          TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          set -o pipefail
          strip_colors() { sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g'; }
          keep_printable_ascii() { tr -cd '\t\n -~'; }
          for log in $(jq -r '.[] | "\(.name)/\(.target.environments[].job_id | select(. != 0))"' <<< "$TARGETS"); do
            target=${log%/*} job_id=${log#*/}
            mkdir -p "autofix/$target"
            gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs" | strip_colors | keep_printable_ascii > "autofix/$log.log"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: autofix-logs
          # Save the logs folder so the `reason` job find the logs.
          path: autofix/
          if-no-files-found: ignore

  reason:
    name: reason (${{ matrix.name }})
    needs: get-failing-integrations
    if: needs.get-failing-integrations.outputs.targets != '[]'
    strategy: &per-target
      fail-fast: false
      max-parallel: 5
      matrix:
        include: ${{ fromJSON(needs.get-failing-integrations.outputs.targets) }}
    # Run on a CodeBuild image with the same arch as the failed job.
    runs-on: &codebuild
      - codebuild-aws-lc-ci-github-actions-${{ github.run_id }}-${{ github.run_attempt }}
        image:${{ matrix.arch == 'aarch64' && 'arm-3.0' || 'linux-5.0' }}
        instance-size:small
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    env: &target
      TARGET: ${{ toJSON(matrix.target) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - &install
        run: |
          python3 --version
          python3 -m pip install -r tests/ci/integration/autofix/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: autofix-logs
          path: autofix
      - env:
          NAME: ${{ matrix.name }}
        run: mkdir -p "$WORK_DIR/out" && mv "autofix/$NAME" "$WORK_DIR/out/logs"
      # Log in to ECR with the runner's own role to pull the CI images, which the Bedrock role cannot pull.
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Pull this arch's CI images and log out of ECR before the agent starts
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ARCH: ${{ matrix.arch }}
        run: |
          for image in $(jq -r --arg arch "$ARCH" '[.environments[] | select(.arch == $arch).image] | unique[]' <<< "$TARGET"); do
            docker pull -q "$ECR_REGISTRY/aws-lc/$image"
          done
          docker logout "$ECR_REGISTRY"
      - &bedrock-region
        name: Load shared Bedrock settings
        run: jq -r '"AWS_REGION=\(.aws_region)"' .github/workflows/ai-config.json >> "$GITHUB_ENV"
      - &bedrock
        uses: ./.github/actions/configure-aws-credentials
        with:
          oidcRole: AwsLcGitHubActionsAutofixOidcRole
          roleName: AwsLcGitHubActionsBedrockRole
      - name: Block containers from the instance and CodeBuild credential endpoints
        run: |
          sudo iptables -I DOCKER-USER -d 169.254.169.254 -j DROP
          sudo iptables -I DOCKER-USER -d 169.254.170.2 -j DROP
      - name: Fix the integration and replay the fix
        working-directory: tests/ci/integration
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: python3 -m autofix reason
      - &upload
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: autofix-${{ matrix.name }}
          path: autofix-work/out/
          overwrite: true

  review:
    name: review (${{ matrix.name }})
    needs: [get-failing-integrations, reason]
    if: ${{ !cancelled() && needs.reason.result != 'skipped' }}
    strategy: *per-target
    runs-on: *codebuild
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env: *target
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - *install
      - uses: actions/download-artifact@v8
        with:
          name: autofix-${{ matrix.name }}
          path: autofix-work/out/
      - *bedrock-region
      - *bedrock
      - name: Review the fix
        working-directory: tests/ci/integration
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 -m autofix review
      - *upload

  resolve:
    needs: [get-failing-integrations, review]
    if: ${{ !cancelled() && needs.review.result != 'skipped' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/autofix_resolve.yml
    with:
      targets: ${{ needs.get-failing-integrations.outputs.targets }}
