name: autofix

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      run_id:
        description: ID of a failed integration-omnibus run to repair
        required: true
      source_repo:
        description: Repository that ran the omnibus, e.g. aws/aws-lc
        required: true
        default: aws/aws-lc

permissions:
  contents: read

env:
  WORK_DIR: ${{ github.workspace }}/autofix-work
  RUN_ID: ${{ inputs.run_id || github.run_id }}
  SOURCE_REPO: ${{ inputs.source_repo || github.repository }}

jobs:
  recognize:
    name: recognize
    runs-on: &codebuild
      - codebuild-aws-lc-ci-github-actions-${{ github.run_id }}-${{ github.run_attempt }}
        image:linux-5.0
        instance-size:small
    permissions:
      contents: read
      actions: read
    outputs:
      targets: ${{ steps.recognize.outputs.targets }}
    steps:
      - &checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - &setup-python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - &install
        run: pip install -r tests/ci/integration/autofix/requirements.txt
      - name: Collect failing targets, logs, and repos
        id: recognize
        working-directory: tests/ci/integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          targets=$(python -m autofix --work-dir "$WORK_DIR" recognize --repo "$SOURCE_REPO" --run-id "$RUN_ID")
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
      # Tar the workspaces so exec bits, git index stat data, and symlinks survive the artifact zip.
      - run: tar -cf autofix-work.tar autofix-work
      - uses: actions/upload-artifact@v7
        with:
          name: autofix-workspaces
          path: autofix-work.tar

  reason:
    name: reason (${{ matrix.target }})
    needs: recognize
    if: needs.recognize.outputs.targets != '[]'
    strategy: &per-target
      fail-fast: false
      max-parallel: 5
      matrix:
        target: ${{ fromJSON(needs.recognize.outputs.targets) }}
    runs-on: *codebuild
    permissions:
      contents: read
      id-token: write
    steps:
      - *checkout
      - *setup-python
      - *install
      - &workspaces
        uses: actions/download-artifact@v8
        with:
          name: autofix-workspaces
      - &untar
        run: tar -xf autofix-work.tar
      # Log in with the runner's own role before assuming the Bedrock role, which cannot pull images.
      - &ecr
        name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Load shared Bedrock settings
        run: jq -r '"AWS_REGION=\(.aws_region)"' .github/workflows/ai-config.json >> "$GITHUB_ENV"
      - uses: ./.github/actions/configure-aws-credentials
        with:
          oidcRole: AwsLcGitHubActionsAutofixOidcRole
          roleName: AwsLcGitHubActionsBedrockRole
      - &block-metadata
        name: Block containers from the instance and CodeBuild credential endpoints
        run: |
          sudo iptables -I DOCKER-USER -d 169.254.169.254 -j DROP
          sudo iptables -I DOCKER-USER -d 169.254.170.2 -j DROP
      - name: Fix the integration with the agent
        working-directory: tests/ci/integration
        env:
          TARGET: ${{ matrix.target }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: python -m autofix --work-dir "$WORK_DIR" reason --target "$TARGET" --registry "$ECR_REGISTRY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: autofix-reason-${{ matrix.target }}
          path: autofix-work/${{ matrix.target }}/out/
          if-no-files-found: ignore

  verify:
    name: verify (${{ matrix.target }})
    needs: [recognize, reason]
    if: ${{ !cancelled() && needs.recognize.result == 'success' && needs.recognize.outputs.targets != '[]' }}
    strategy: *per-target
    runs-on: *codebuild
    permissions:
      contents: read
    steps:
      - *checkout
      - *setup-python
      - *install
      - *workspaces
      - *untar
      - &reason-out
        uses: actions/download-artifact@v8
        with:
          name: autofix-reason-${{ matrix.target }}
          path: autofix-work/${{ matrix.target }}/out/
      - *ecr
      - *block-metadata
      - name: Run the integration exactly like CI with the fix applied
        working-directory: tests/ci/integration
        env:
          TARGET: ${{ matrix.target }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: python -m autofix --work-dir "$WORK_DIR" verify --target "$TARGET" --registry "$ECR_REGISTRY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: autofix-verify-${{ matrix.target }}
          path: autofix-work/${{ matrix.target }}/verify/
          if-no-files-found: ignore

  resolve:
    name: resolve (${{ matrix.target }})
    needs: [recognize, verify]
    if: ${{ !cancelled() && needs.recognize.result == 'success' && needs.recognize.outputs.targets != '[]' }}
    strategy: *per-target
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - *checkout
      - *setup-python
      - *install
      - *workspaces
      - *untar
      - *reason-out
      - uses: actions/download-artifact@v8
        with:
          name: autofix-verify-${{ matrix.target }}
          path: autofix-work/${{ matrix.target }}/verify/
      - name: Push the fix to the fork and open a draft PR
        working-directory: tests/ci/integration
        env:
          TARGET: ${{ matrix.target }}
          FORK: ${{ vars.AUTOFIX_FORK }}
          GH_TOKEN: ${{ secrets.AUTOFIX_FORK_TOKEN }}
        run: python -m autofix --work-dir "$WORK_DIR" resolve --target "$TARGET" --repo "$GITHUB_REPOSITORY" --fork "$FORK"
