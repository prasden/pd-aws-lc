name: autofix

on:
  workflow_call:

permissions:
  contents: read

env:
  WORK_DIR: ${{ github.workspace }}/autofix-work

jobs:
  recognize:
    name: recognize
    runs-on:
      - codebuild-aws-lc-ci-github-actions-${{ github.run_id }}-${{ github.run_attempt }}
        image:linux-5.0
        instance-size:small
    permissions:
      contents: read
      actions: read
    outputs:
      targets: ${{ steps.recognize.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Collect failing targets, logs, and repos
        id: recognize
        working-directory: tests/ci/integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m autofix recognize --repo "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --work-dir "$WORK_DIR"
      - uses: actions/upload-artifact@v7
        with:
          name: autofix-workspaces
          path: autofix-work/
          include-hidden-files: true

  reason:
    name: reason (${{ matrix.target }})
    needs: recognize
    if: needs.recognize.outputs.targets != '[]'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        target: ${{ fromJSON(needs.recognize.outputs.targets) }}
    runs-on:
      - codebuild-aws-lc-ci-github-actions-${{ github.run_id }}-${{ github.run_attempt }}
        image:linux-5.0
        instance-size:small
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: autofix-workspaces
          path: autofix-work/
      # Log in with the runner's own role before assuming the Bedrock role, which cannot pull images.
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Load shared Bedrock settings
        run: jq -r '"AWS_REGION=\(.aws_region)"' .github/workflows/ai-config.json >> "$GITHUB_ENV"
      - uses: ./.github/actions/configure-aws-credentials
        with:
          oidcRole: AwsLcGitHubActionsAutofixOidcRole
          roleName: AwsLcGitHubActionsBedrockRole
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Fix the integration with the agent
        working-directory: tests/ci/integration
        env:
          TARGET: ${{ matrix.target }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: python -m autofix reason --work-dir "$WORK_DIR" --target "$TARGET" --registry "$ECR_REGISTRY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: autofix-reason-${{ matrix.target }}
          path: autofix-work/${{ matrix.target }}/out/
          if-no-files-found: ignore

  verify:
    name: verify (${{ matrix.target }})
    needs: [recognize, reason]
    if: always() && needs.recognize.outputs.targets != '[]'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        target: ${{ fromJSON(needs.recognize.outputs.targets) }}
    runs-on:
      - codebuild-aws-lc-ci-github-actions-${{ github.run_id }}-${{ github.run_attempt }}
        image:linux-5.0
        instance-size:small
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: autofix-workspaces
          path: autofix-work/
      - uses: actions/download-artifact@v8
        with:
          name: autofix-reason-${{ matrix.target }}
          path: autofix-work/${{ matrix.target }}/out/
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Run the integration exactly like CI with the fix applied
        working-directory: tests/ci/integration
        env:
          TARGET: ${{ matrix.target }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: python -m autofix verify --work-dir "$WORK_DIR" --target "$TARGET" --registry "$ECR_REGISTRY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: autofix-verify-${{ matrix.target }}
          path: autofix-work/${{ matrix.target }}/verify/
          if-no-files-found: ignore

  resolve:
    name: resolve (${{ matrix.target }})
    needs: [recognize, verify]
    if: always() && needs.recognize.outputs.targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.recognize.outputs.targets) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: autofix-reason-${{ matrix.target }}
          path: autofix-work/${{ matrix.target }}/out/
      - uses: actions/download-artifact@v8
        with:
          name: autofix-verify-${{ matrix.target }}
          path: autofix-work/${{ matrix.target }}/verify/
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Open a PR if verify passed
        working-directory: tests/ci/integration
        env:
          TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ github.token }}
        run: python -m autofix resolve --work-dir "$WORK_DIR" --target "$TARGET" --repo "$GITHUB_REPOSITORY"
