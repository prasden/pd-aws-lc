name: autofix

on:
  workflow_run:
    workflows: [integration-omnibus]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: ID of a failed integration-omnibus run to repair
        required: true
      source_repo:
        description: Repository that ran the omnibus, e.g. aws/aws-lc
        required: true
        default: aws/aws-lc

permissions:
  contents: read

env:
  WORK_DIR: ${{ github.workspace }}/autofix-work
  RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
  SOURCE_REPO: ${{ inputs.source_repo || github.repository }}

jobs:
  recognize:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event.workflow_run.event) &&
       github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      reason: ${{ steps.recognize.outputs.reason }}
      verify: ${{ steps.recognize.outputs.verify }}
    steps:
      - &checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - &setup-python
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          activate-environment: true
      - &install
        run: uv pip install -r tests/ci/integration/autofix/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          pattern: integration-failure-*
          path: autofix-reports
          run-id: ${{ env.RUN_ID }}
          repository: ${{ env.SOURCE_REPO }}
          github-token: ${{ github.token }}
      - name: Find the commit the omnibus tested
        id: omnibus
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "sha=$(gh api "repos/$SOURCE_REPO/actions/runs/$RUN_ID" --jq .head_sha)" >> "$GITHUB_OUTPUT"
      - name: List the failing targets
        id: recognize
        working-directory: tests/ci/integration
        env:
          AWSLC_SHA: ${{ steps.omnibus.outputs.sha }}
        run: |
          matrix=$(python -m autofix recognize --reports "$GITHUB_WORKSPACE/autofix-reports" \
            --awslc-repo "https://github.com/$SOURCE_REPO.git" --awslc-sha "$AWSLC_SHA")
          jq -r '"reason=\(.reason | tojson)", "verify=\(.verify | tojson)"' <<< "$matrix" >> "$GITHUB_OUTPUT"

  reason:
    name: reason (${{ matrix.name }})
    needs: recognize
    if: needs.recognize.outputs.reason != '[]'
    strategy: &per-target
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.recognize.outputs.reason) }}
    runs-on: &codebuild
      - codebuild-aws-lc-ci-github-actions-${{ github.run_id }}-${{ github.run_attempt }}
        image:${{ matrix.arch == 'aarch64' && 'arm-3.0' || 'linux-5.0' }}
        instance-size:${{ matrix.size }}
    permissions:
      contents: read
      actions: read
      id-token: write
    env: &target
      TARGET: ${{ toJSON(matrix.target) }}
    steps:
      - *checkout
      - *setup-python
      - *install
      - name: Download the failed job logs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$WORK_DIR/out/logs"
          for job_id in $(jq -r '.environments[].job_id | select(. != 0)' <<< "$TARGET"); do
            gh api --allow-escape-sequences "repos/$SOURCE_REPO/actions/jobs/$job_id/logs" |
              sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' | tr -cd '\11\12\40-\176' > "$WORK_DIR/out/logs/$job_id.log" ||
              echo "::warning::Could not download the log of CI job $job_id"
          done
      # Log in with the runner's own role before assuming the Bedrock role, which cannot pull images.
      - &ecr
        name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - &bedrock-region
        name: Load shared Bedrock settings
        run: jq -r '"AWS_REGION=\(.aws_region)"' .github/workflows/ai-config.json >> "$GITHUB_ENV"
      - &bedrock
        uses: ./.github/actions/configure-aws-credentials
        with:
          oidcRole: AwsLcGitHubActionsAutofixOidcRole
          roleName: AwsLcGitHubActionAutofixReasoningRole
      - &block-metadata
        name: Block containers from the instance and CodeBuild credential endpoints
        run: |
          sudo iptables -I DOCKER-USER -d 169.254.169.254 -j DROP
          sudo iptables -I DOCKER-USER -d 169.254.170.2 -j DROP
      - name: Fix the integration and verify it
        working-directory: tests/ci/integration
        env: &registry
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: python -m autofix reason
      - &upload
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: autofix-${{ matrix.name }}-${{ github.job }}-${{ matrix.arch }}
          path: autofix-work/out/
          if-no-files-found: ignore
      - &summary
        name: Summarize the failure on the run page
        if: failure()
        env:
          HEADING: "${{ github.job }} ${{ matrix.name }} on ${{ matrix.arch }} failed"
          OUT: autofix-work/out
        run: |
          {
            echo "## $HEADING"
            jq -r 'if has("safe") then "**review**: safe=\(.safe)", (.findings[] | "- \(.)")
                   else "**verify**: passed=\(.passed)\n~~~\n\(.report[-3000:])\n~~~" end' \
              "$OUT"/verify-*.json "$OUT"/review.json 2>/dev/null || true
            echo "Open the job log for the error."
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: verify (${{ matrix.name }}, ${{ matrix.arch }})
    needs: [recognize, reason]
    if: ${{ !cancelled() && needs.recognize.result == 'success' && needs.recognize.outputs.verify != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.recognize.outputs.verify) }}
    runs-on: *codebuild
    env: *target
    steps:
      - *checkout
      - *setup-python
      - *install
      - &results
        uses: actions/download-artifact@v8
        with:
          pattern: autofix-${{ matrix.name }}-{reason,verify,review}-{x86_64,aarch64}
          path: autofix-work/out/
          merge-multiple: true
      - *ecr
      - *block-metadata
      - name: Replay the failed CI jobs with the fix
        working-directory: tests/ci/integration
        env: *registry
        run: python -m autofix verify
      - *upload
      - *summary

  review:
    name: review (${{ matrix.name }})
    needs: [recognize, reason, verify]
    if: &has-targets ${{ !cancelled() && needs.recognize.result == 'success' && needs.recognize.outputs.reason != '[]' }}
    strategy: *per-target
    runs-on: *codebuild
    permissions:
      contents: read
      id-token: write
    env: *target
    steps:
      - *checkout
      - *setup-python
      - *install
      - *results
      - *bedrock-region
      - *bedrock
      - name: Review the verified fix
        working-directory: tests/ci/integration
        run: python -m autofix review
      - *upload
      - *summary

  resolve:
    name: resolve (${{ matrix.name }})
    needs: [recognize, review]
    if: *has-targets
    strategy: *per-target
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env: *target
    steps:
      - name: Skip a target that already has an open autofix PR
        id: open-pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: autofix/${{ matrix.name }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json url --jq '.[0].url')
          [ -z "$pr" ] || echo "::notice::$BRANCH already has an open PR: $pr"
          echo "url=$pr" >> "$GITHUB_OUTPUT"
      - *checkout
      - if: &no-open-pr steps.open-pr.outputs.url == ''
        uses: actions/checkout@v7
        with:
          repository: prasden/pd-aws-lc
          path: aws-lc-fix
          fetch-depth: 0
          persist-credentials: false
      - *setup-python
      - *install
      - *results
      - name: Commit the fix
        id: commit
        if: *no-open-pr
        working-directory: tests/ci/integration
        run: |
          pr=$(python -m autofix resolve --checkout "$GITHUB_WORKSPACE/aws-lc-fix")
          jq -r '"branch=\(.branch)", "title=\(.title)"' <<< "$pr" >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@v2
        id: fork-token
        if: *no-open-pr
        with:
          app-id: ${{ vars.AUTOFIX_APP_ID }}
          private-key: ${{ secrets.AUTOFIX_APP_PRIVATE_KEY }}
          owner: prasden
          repositories: pd-aws-lc
          permission-contents: write
      - uses: actions/create-github-app-token@v2
        id: upstream-token
        if: *no-open-pr
        with:
          app-id: ${{ vars.AUTOFIX_APP_ID }}
          private-key: ${{ secrets.AUTOFIX_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
      - name: Push the fix to the fork and open a draft PR
        if: *no-open-pr
        env:
          FORK_TOKEN: ${{ steps.fork-token.outputs.token }}
          UPSTREAM_TOKEN: ${{ steps.upstream-token.outputs.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          TITLE: ${{ steps.commit.outputs.title }}
        run: |
          GH_TOKEN="$FORK_TOKEN" gh auth setup-git
          GH_TOKEN="$FORK_TOKEN" git -C aws-lc-fix -c core.hooksPath=/dev/null push -q \
            https://github.com/prasden/pd-aws-lc.git "HEAD:refs/heads/$BRANCH"
          GH_TOKEN="$UPSTREAM_TOKEN" gh pr create --draft --repo "$GITHUB_REPOSITORY" --head "prasden:$BRANCH" \
            --title "$TITLE" --body-file autofix-work/out/pr.md
      - *summary
