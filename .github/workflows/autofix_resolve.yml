name: autofix-resolve

on:
  workflow_call:
    inputs:
      targets:
        required: true
        type: string

jobs:
  resolve:
    name: resolve (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.targets) }}
    runs-on:
      - codebuild-aws-lc-ci-github-actions-${{ github.run_id }}-${{ github.run_attempt }}
        image:linux-5.0
        instance-size:small
    timeout-minutes: 15
    env:
      BRANCH: autofix/${{ matrix.name }}
      MESSAGE: Fix the ${{ matrix.name }} integration patch
      OUT: ${{ github.workspace }}/autofix-work/out
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.target.awslc.sha }}
          path: aws-lc-fix
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: autofix-${{ matrix.name }}
          path: ${{ env.OUT }}
      - name: Apply the fix
        working-directory: aws-lc-fix
        run: |
          test -f "$OUT/pr.md"
          git apply --index "$OUT/changes.diff"
      - name: Check the fix edits only the runner and its patch files
        working-directory: aws-lc-fix
        env:
          RUNNER: tests/ci/integration/run_${{ matrix.target.name }}_integration.sh
        run: |
          git diff --cached --name-only --no-renames --exit-code -- \
            ":(exclude)$RUNNER" ":(exclude,glob)tests/ci/integration/**/*.patch" ||
            { echo "::error::The fix edits the files above, outside the runner and its patch files."; exit 1; }
      - name: Commit the fix
        working-directory: aws-lc-fix
        run: |
          git -c core.hooksPath=/dev/null -c user.name=acl-ci-autofix -c user.email=acl-ci-autofix@users.noreply.github.com \
            commit -qm "$MESSAGE"
      - uses: actions/create-github-app-token@v2
        id: push-app-token
        continue-on-error: true
        with:
          app-id: ${{ vars.AUTOFIX_PUSH_APP_ID }}
          private-key: ${{ secrets.AUTOFIX_APP_PRIVATE_KEY }}
          owner: prasden
          repositories: pd-aws-lc
          permission-contents: write
          permission-workflows: write
      - uses: actions/create-github-app-token@v2
        id: fallback-push-token
        if: steps.push-app-token.outcome != 'success'
        with:
          app-id: ${{ vars.AUTOFIX_APP_ID }}
          private-key: ${{ secrets.AUTOFIX_APP_PRIVATE_KEY }}
          owner: prasden
          repositories: pd-aws-lc
          permission-contents: write
      - uses: actions/create-github-app-token@v2
        id: pr-token
        with:
          app-id: ${{ vars.AUTOFIX_APP_ID }}
          private-key: ${{ secrets.AUTOFIX_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
      - name: Push the fix to the fork and open a draft PR
        working-directory: aws-lc-fix
        env:
          GH_TOKEN: ${{ steps.pr-token.outputs.token }}
          PUSH_TOKEN: ${{ steps.push-app-token.outputs.token || steps.fallback-push-token.outputs.token }}
        run: |
          open_prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --json number --jq length)
          if [ "$open_prs" != 0 ]; then
            echo "::notice::$BRANCH already has an open PR."
            exit 0
          fi

          GH_TOKEN="$PUSH_TOKEN" gh auth setup-git
          GH_TOKEN="$PUSH_TOKEN" git -c core.hooksPath=/dev/null push -q \
            https://github.com/prasden/pd-aws-lc.git "+HEAD:refs/heads/$BRANCH"

          gh pr create --draft --no-maintainer-edit \
            --repo "$GITHUB_REPOSITORY" \
            --head "prasden:$BRANCH" \
            --title "[autofix] $MESSAGE" \
            --body-file "$OUT/pr.md"
