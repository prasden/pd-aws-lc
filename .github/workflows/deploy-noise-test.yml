name: deploy-noise-test

on:
  pull_request_target:
    branches: ["**"]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      approval-env: ${{ steps.auth.outputs.approval-env }}
    steps:
      - uses: actions/checkout@v7
      - id: auth
        uses: ./.github/actions/check-authorization

  broken:
    needs: authorize
    runs-on: ubuntu-latest
    environment: ${{ needs.authorize.outputs.approval-env }}
    steps:
      - run: echo "BROKEN pattern, env=${{ needs.authorize.outputs.approval-env }}, this job creates a deployment record"

  fixed:
    needs: authorize
    runs-on: ubuntu-latest
    environment: ${{ needs.authorize.outputs.approval-env == 'manual-approval' && 'manual-approval' || '' }}
    steps:
      - run: echo "FIXED pattern, blank env for write-access authors, no deployment record"

  gate:
    needs: authorize
    runs-on: ubuntu-latest
    environment: manual-approval
    steps:
      - run: echo "GATE, this job pauses for manual approval before it runs"
