name: integration-omnibus
on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true
env:
  GOPROXY: https://proxy.golang.org,direct
permissions:
  contents: read
  actions: read

jobs:
  integrations:
    name: ${{ matrix.name }}-${{ matrix.arch }}
    runs-on:
      - codebuild-aws-lc-ci-github-actions-${{ github.run_id }}-${{ github.run_attempt }}
        image:${{ matrix.arch == 'x86_64' && 'linux-5.0' || matrix.arch == 'aarch64' && 'arm-3.0' }}
        instance-size:${{ matrix.size }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # TEST-ONLY: ntp has a patch dir, so it reaches Claude in the reason job.
          # We intentionally break its patch so Claude has real repair work, which
          # verifies the denyRead/sandbox restrictions still let Claude do its job.
          - name: ntp
            arch: x86_64
            size: small
            image: ubuntu:22.04
            compiler: gcc-12
            run: ./tests/ci/integration/run_ntp_integration.sh
    env:
      OPENSSH_BRANCH: ${{ matrix.openssh_branch || '' }}
      ACCP_FIPS: ${{ matrix.accp_fips || '' }}
    steps:
      - uses: actions/checkout@v6
      # TEST-ONLY: skip the real integration test, just fail so the autofix emit step runs.
      - name: Force failure for autofix test
        shell: bash
        run: |
          echo "::error::synthetic failure to trigger autofix emit"
          exit 1
      # matrix.name (e.g. "postgresql") doesn't always match the patch dir
      # name ("postgres_patch"), we use the runner script path as the source of truth.
      - name: Get failed integration name and version
        id: autofix-target
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          # Iterate every line so multi-line `run:` blocks (e.g. bind9, which
          # pip-installs meson before the runner) correctly identify the runner script.
          while read -r line_path line_ver _; do
            [[ -n "$line_path" ]] && script_path="$line_path" version="$line_ver"
          done <<< "$run_command"

          integration=${script_path##*/}  # Strip everything before the last / so we have just the filename.
          integration=${integration%.sh}  # Drop the .sh extension.
          integration=${integration#run_} # Drop the run_ prefix shared by every runner.
          integration=${integration%_integration} # Drop the _integration suffix to leave the bare integration name.
          version=${version//[\'\"]/} # Strip surrounding quotes (some matrix entries quote the version arg).

          echo "integration=$integration" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          run_command: ${{ matrix.run }}

      - name: Upload failed integration target
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: ./.github/actions/emit-autofix-target
        with:
          integration: ${{ steps.autofix-target.outputs.integration }}
          version: ${{ steps.autofix-target.outputs.version }}
          failed-integration: ${{ matrix.name }}-${{ matrix.arch }}

  report-failures:
    name: report-failures
    needs: [integrations]
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on:
      - codebuild-aws-lc-ci-github-actions-${{ github.run_id }}-${{ github.run_attempt }}
        image:linux-5.0
        instance-size:small
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/configure-aws-credentials
        with:
          roleName: AwsLcGitHubActionStandardRole
      - name: Emit failure metric
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -exo pipefail
          failure_count=$(gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[].name' \
            | wc -l)

          aws cloudwatch put-metric-data \
            --namespace AWS-LC \
            --metric-name IntegrationOmnibusFailure \
            --value "$failure_count"
