name: integration-omnibus
on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true
env:
  GOPROXY: https://proxy.golang.org,direct
permissions:
  contents: read
  actions: read

jobs:
  integrations:
    name: ${{ matrix.name }}-${{ matrix.arch }}
    runs-on:
      - codebuild-aws-lc-ci-github-actions-${{ github.run_id }}-${{ github.run_attempt }}
        image:${{ matrix.arch == 'x86_64' && 'linux-5.0' || matrix.arch == 'aarch64' && 'arm-3.0' }}
        instance-size:${{ matrix.size }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mariadb
            arch: x86_64
            size: 2xlarge
            image: ubuntu:22.04
            compiler: gcc-12
            run: ./tests/ci/integration/run_mariadb_integration.sh
          - name: openssh-v8.9
            arch: x86_64
            size: small
            image: amazonlinux:2023
            compiler: clang-15
            openssh_branch: V_8_9
            run: ./tests/ci/integration/run_openssh_integration.sh
          - name: bind9
            arch: x86_64
            size: medium
            image: ubuntu:22.04
            compiler: gcc-12
            ipv6: true
            options: --privileged
            run: |
              python3 -m pip install --upgrade meson
              ./tests/ci/integration/run_bind9_integration.sh
    env:
      OPENSSH_BRANCH: ${{ matrix.openssh_branch || '' }}
      ACCP_FIPS: ${{ matrix.accp_fips || '' }}
    steps:
      - uses: actions/checkout@v6
      # TEST-ONLY: skip the real integration test, just fail so the autofix
      # emit step runs.
      - name: Force failure for autofix test
        shell: bash
        run: |
          echo "::error::synthetic failure to trigger autofix emit"
          exit 1

      # matrix.name (e.g. "postgresql") doesn't always match the patch dir
      # name ("postgres_patch"), we use the runner script path as the source of truth.
      - name: Get failed integration name and version
        id: autofix-target
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          # Iterate every line so multi-line `run:` blocks (e.g. bind9, which
          # pip-installs meson before the runner) correctly identify the runner script.
          while read -r line_path line_ver _; do
            [[ -n "$line_path" ]] && script_path="$line_path" version="$line_ver"
          done <<< "$run_command"

          integration=${script_path##*/}
          integration=${integration%.sh}
          integration=${integration#run_}
          integration=${integration%_integration}
          version=${version//[\'\"]/}

          # openssh selects its branch via $OPENSSH_BRANCH, not a positional arg.
          [[ -z "$version" && "$integration" == "openssh" ]] && version="$OPENSSH_BRANCH"
          echo "integration=$integration" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          run_command: ${{ matrix.run }}

      - name: Upload failed integration target
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: ./.github/actions/emit-autofix-target
        with:
          integration: ${{ steps.autofix-target.outputs.integration }}
          version: ${{ steps.autofix-target.outputs.version }}
          failed-integration: ${{ matrix.name }}-${{ matrix.arch }}

  report-failures:
    name: report-failures
    needs: [integrations]
    if: ${{ always() && github.event_name == 'schedule' && needs.integrations.result == 'failure' }}
    runs-on:
      - codebuild-aws-lc-ci-github-actions-${{ github.run_id }}-${{ github.run_attempt }}
        image:linux-5.0
        instance-size:small
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/configure-aws-credentials
        with:
          roleName: AwsLcGitHubActionStandardRole
      - name: Emit failure metric
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -exo pipefail
          failure_count=$(gh run view "$GITHUB_RUN_ID" --json jobs \
            --jq '[.jobs[] | select(.conclusion == "failure" and .name != "report-failures")] | length')

          aws cloudwatch put-metric-data \
            --namespace AWS-LC \
            --metric-name IntegrationOmnibusFailure \
            --value "$failure_count"
