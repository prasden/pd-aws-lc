name: integration-omnibus
on:
  push:
    branches: ['main', 'fips-*']
  pull_request:
    branches: [ '*' ]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true
env:
  GOPROXY: https://proxy.golang.org,direct
permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  integrations:
    name: ${{ matrix.name }}-${{ matrix.arch }}${{ matrix.allow_failure && '-allow-failure' || '' }}
    continue-on-error: ${{ matrix.allow_failure || false }}
    runs-on:
      - codebuild-aws-lc-ci-github-actions-${{ github.run_id }}-${{ github.run_attempt }}
        image:${{ matrix.arch == 'x86_64' && 'linux-5.0' || matrix.arch == 'aarch64' && 'arm-3.0' }}
        instance-size:${{ matrix.size }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nginx
            arch: x86_64
            size: medium
            image: ubuntu:22.04
            compiler: gcc-12
            user: postgres
            run: ./tests/ci/integration/run_nginx_integration.sh
          - name: openssh-10.4p1
            arch: x86_64
            size: small
            image: amazonlinux:2023
            compiler: clang-15
            run: ./tests/ci/integration/run_openssh_integration.sh V_10_4_P1
          - name: openssh-10.4p1
            arch: aarch64
            size: 2xlarge
            image: amazonlinux:2023
            compiler: clang-15
            run: ./tests/ci/integration/run_openssh_integration.sh V_10_4_P1
          - name: postgresql
            arch: x86_64
            size: medium
            image: ubuntu:22.04
            compiler: gcc-12
            user: postgres
            run: ./tests/ci/integration/run_postgres_integration.sh
          - name: postgresql
            arch: aarch64
            size: large
            image: ubuntu:22.04
            compiler: gcc-12
            user: postgres
            run: ./tests/ci/integration/run_postgres_integration.sh
          - name: mariadb
            arch: x86_64
            size: 2xlarge
            image: ubuntu:22.04
            compiler: gcc-12
            run: ./tests/ci/integration/run_mariadb_integration.sh
          - name: mariadb
            arch: aarch64
            size: 2xlarge
            image: ubuntu:22.04
            compiler: gcc-12
            run: ./tests/ci/integration/run_mariadb_integration.sh
          - name: librelp
            arch: x86_64
            size: small
            image: ubuntu:22.04
            compiler: gcc-12
            run: ./tests/ci/integration/run_librelp_integration.sh v1.13
          - name: krb5
            arch: x86_64
            size: small
            image: ubuntu:22.04
            compiler: gcc-12
            run: ./tests/ci/integration/run_krb5_integration.sh krb5-1.22.2-final
          - name: grpc
            arch: x86_64
            size: 2xlarge
            image: ubuntu:22.04
            compiler: gcc-12
            ipv6: true
            run: ./tests/ci/integration/run_grpc_integration.sh v1.72.2
    env:
      ACCP_FIPS: ${{ matrix.accp_fips || '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: ./.github/actions/codebuild-docker-run
        name: Run Container
        id: integration-test
        with:
          image: ${{ steps.login-ecr.outputs.registry }}/aws-lc/${{ matrix.image }}
          env: |
            ACCP_FIPS
            GITHUB_SHA
          options: ${{ matrix.options || '' }}
          user: ${{ matrix.user || '' }}
          ipv6: ${{ matrix.ipv6 || false }}
          withCredentials: ${{ matrix.credentials || false }}
          run: |
            source /opt/compiler-env/setup-${{ matrix.compiler }}.sh
            ${{ matrix.run }}
      - name: Record job settings
        if: always() && steps.integration-test.outcome == 'failure' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !matrix.allow_failure && hashFiles('integration-failure.txt') != ''
        env:
          MATRIX: ${{ toJSON(matrix) }}
          JOB_ID: ${{ job.check_run_id }}
        run: |
          echo "job=$(jq -c '{job_id: (env.JOB_ID | tonumber), env_vars: (env | {ACCP_FIPS})} + .' <<< "$MATRIX")" >> integration-failure.txt
      - uses: actions/upload-artifact@v7
        if: always() && steps.integration-test.outcome == 'failure' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !matrix.allow_failure
        with:
          name: integration-failure-${{ matrix.name }}-${{ matrix.arch }}
          path: integration-failure.txt
          if-no-files-found: ignore

  python:
    if: false
    name: python-${{ matrix.version }}${{ matrix.buildFIPS == 1 && '-fips' || '' }}-${{ matrix.crtUseSystemCrypto == 1 && 'crt-vendored-crypto' || 'crt-system-crypto' }}-${{ matrix.arch }}
    runs-on:
      - codebuild-aws-lc-ci-github-actions-${{ github.run_id }}-${{ github.run_attempt }}
        image:linux-5.0
        instance-size:medium
    strategy:
      fail-fast: false
      matrix:
        arch: ["x86_64"]
        version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
        buildFIPS: [0, 1]
        crtUseSystemCrypto: [0, 1]
        # Python 3.12+ uses prebuilt CRT wheels, so the linkage selector
        # does not change the build or tests for these versions.
        exclude:
          - version: "3.12"
            crtUseSystemCrypto: 1
          - version: "3.13"
            crtUseSystemCrypto: 1
          - version: "3.14"
            crtUseSystemCrypto: 1
          - version: "3.15"
            crtUseSystemCrypto: 1
        include:
          - version: main
            buildFIPS: 0
            crtUseSystemCrypto: 0
            arch: x86_64
    env:
      FIPS: ${{ matrix.buildFIPS }}
      AWS_CRT_BUILD_USE_SYSTEM_LIBCRYPTO: ${{ matrix.crtUseSystemCrypto }}
    steps:
      - uses: actions/checkout@v7
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: ./.github/actions/codebuild-docker-run
        name: Run Container
        id: integration-test
        with:
          image: ${{ steps.login-ecr.outputs.registry }}/aws-lc/ubuntu:22.04
          env: |
            FIPS
            AWS_CRT_BUILD_USE_SYSTEM_LIBCRYPTO
            GITHUB_SHA
          ipv6: true
          run: |
            source /opt/compiler-env/setup-gcc-12.sh
            ./tests/ci/integration/run_python_integration.sh ${{ matrix.version }}
      - name: Record job settings
        if: always() && steps.integration-test.outcome == 'failure' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && hashFiles('integration-failure.txt') != ''
        env:
          MATRIX: ${{ toJSON(matrix) }}
          JOB_ID: ${{ job.check_run_id }}
        run: |
          echo "job=$(jq -c '{job_id: (env.JOB_ID | tonumber), size: "medium", image: "ubuntu:22.04",
            compiler: "gcc-12", ipv6: true, env_vars: (env | {FIPS, AWS_CRT_BUILD_USE_SYSTEM_LIBCRYPTO})} + .' \
            <<< "$MATRIX")" >> integration-failure.txt
      - uses: actions/upload-artifact@v7
        if: always() && steps.integration-test.outcome == 'failure' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        with:
          name: integration-failure-python-${{ matrix.version }}-${{ matrix.buildFIPS }}-${{ matrix.crtUseSystemCrypto }}-${{ matrix.arch }}
          path: integration-failure.txt
          if-no-files-found: ignore

  ruby:
    name: ruby-${{ matrix.version }}${{ matrix.buildFIPS == 1 && '-fips' || '' }}-${{ matrix.arch }}
    runs-on:
      - codebuild-aws-lc-ci-github-actions-${{ github.run_id }}-${{ github.run_attempt }}
        image:linux-5.0
        instance-size:medium
    strategy:
      fail-fast: false
      matrix:
        arch: ["x86_64"]
        version: [master]
        buildFIPS: [0, 1]
    env:
      FIPS: ${{ matrix.buildFIPS }}
    steps:
      - uses: actions/checkout@v7
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: ./.github/actions/codebuild-docker-run
        name: Run Container
        id: integration-test
        with:
          image: ${{ steps.login-ecr.outputs.registry }}/aws-lc/ubuntu:24.04
          env: |
            FIPS
            GITHUB_SHA
          ipv6: true
          run: |
            source /opt/compiler-env/setup-gcc-13.sh
            ./tests/ci/integration/run_ruby_integration.sh ${{ matrix.version }}
      - name: Record job settings
        if: always() && steps.integration-test.outcome == 'failure' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && hashFiles('integration-failure.txt') != ''
        env:
          MATRIX: ${{ toJSON(matrix) }}
          JOB_ID: ${{ job.check_run_id }}
        run: |
          echo "job=$(jq -c '{job_id: (env.JOB_ID | tonumber), size: "medium", image: "ubuntu:24.04",
            compiler: "gcc-13", ipv6: true, env_vars: (env | {FIPS})} + .' <<< "$MATRIX")" >> integration-failure.txt
      - uses: actions/upload-artifact@v7
        if: always() && steps.integration-test.outcome == 'failure' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        with:
          name: integration-failure-ruby-${{ matrix.version }}-${{ matrix.buildFIPS }}-${{ matrix.arch }}
          path: integration-failure.txt
          if-no-files-found: ignore

  report-failures:
    name: report-failures
    needs: [integrations, python, ruby]
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on:
      - codebuild-aws-lc-ci-github-actions-${{ github.run_id }}-${{ github.run_attempt }}
        image:linux-5.0
        instance-size:small
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/configure-aws-credentials
      - name: Emit failure metric
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -exo pipefail
          # Count the number of failing tests, excluding tests which are allowed to fail.
          failure_count=$(gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure" and (.name | endswith("-allow-failure") | not)) | .name' \
            | wc -l | tr -d ' ')

          aws cloudwatch put-metric-data \
            --namespace AWS-LC \
            --metric-name IntegrationOmnibusFailure \
            --value "$failure_count"
