name: integration-omnibus
on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true
env:
  GOPROXY: https://proxy.golang.org,direct
permissions:
  contents: read
  actions: read

jobs:
  integrations:
    name: ${{ matrix.name }}-${{ matrix.arch }}
    runs-on:
      - codebuild-aws-lc-ci-github-actions-${{ github.run_id }}-${{ github.run_attempt }}
        image:${{ matrix.arch == 'x86_64' && 'linux-5.0' || matrix.arch == 'aarch64' && 'arm-3.0' }}
        instance-size:${{ matrix.size }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mariadb
            arch: x86_64
            size: 2xlarge
            image: ubuntu:22.04
            compiler: gcc-12
            run: ./tests/ci/integration/run_mariadb_integration.sh
    env:
      OPENSSH_BRANCH: ${{ matrix.openssh_branch || '' }}
      ACCP_FIPS: ${{ matrix.accp_fips || '' }}
    steps:
      - uses: actions/checkout@v6
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: ./.github/actions/codebuild-docker-run
        name: Run Container
        with:
          image: ${{ steps.login-ecr.outputs.registry }}/aws-lc/${{ matrix.image }}
          env: |
            OPENSSH_BRANCH
            ACCP_FIPS
          options: ${{ matrix.options || '' }}
          user: ${{ matrix.user || '' }}
          ipv6: ${{ matrix.ipv6 || false }}
          withCredentials: ${{ matrix.credentials || false }}
          run: |
            source /opt/compiler-env/setup-${{ matrix.compiler }}.sh
            ${{ matrix.run }}
      # Read the integration name and version off the runner script path so we
      # know which patch directory failed. matrix.name (e.g. "postgresql") 
      # doesn't always match the  patch directory ("postgres_patch"), so the runner script path is the source of truth.
      - name: Get failed integration name and version
        id: autofix-target
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          # Runner format: ./tests/ci/integration/run_<integration>_integration.sh [<version>]
          # A few matrix entries (e.g. bind9) use a multi-line `run:` block that
          # runs setup commands before the runner. Iterating every line and
          # keeping the last non-empty one ensures we land on the runner
          # invocation, not the setup command.
          while read -r line_path line_ver _; do
            [[ -n "$line_path" ]] && script_path="$line_path" version="$line_ver"
          done <<< "$run_command"

          integration=${script_path##*/}
          integration=${integration%.sh}
          integration=${integration#run_}
          integration=${integration%_integration}
          version=${version//[\'\"]/}

          # openssh is the one runner that selects its branch from an env var
          # ($OPENSSH_BRANCH set on the matrix entry) instead of a positional
          # arg, so fall back to that env when the parsed version is empty.
          [[ -z "$version" && "$integration" == "openssh" ]] && version="$OPENSSH_BRANCH"
          echo "integration=$integration" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          run_command: ${{ matrix.run }}

      # Upload the (integration, version) pair as an artifact so the
      # autofix-integration-omnibus workflow (triggered by workflow_run when
      # this run completes) can download every failed target and autofix per (integration, version).
      - name: Upload failed integration target
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: ./.github/actions/emit-autofix-target
        with:
          integration: ${{ steps.autofix-target.outputs.integration }}
          version: ${{ steps.autofix-target.outputs.version }}
          failed-integration: ${{ matrix.name }}-${{ matrix.arch }}

  report-failures:
    name: report-failures
    needs: [integrations]
    if: ${{ always() && github.event_name == 'schedule' && needs.integrations.result == 'failure' }}
    runs-on:
      - codebuild-aws-lc-ci-github-actions-${{ github.run_id }}-${{ github.run_attempt }}
        image:linux-5.0
        instance-size:small
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/configure-aws-credentials
        with:
          roleName: AwsLcGitHubActionStandardRole
      - name: Emit failure metric
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -exo pipefail
          failure_count=$(gh run view "$GITHUB_RUN_ID" --json jobs \
            --jq '[.jobs[] | select(.conclusion == "failure" and .name != "report-failures")] | length')

          aws cloudwatch put-metric-data \
            --namespace AWS-LC \
            --metric-name IntegrationOmnibusFailure \
            --value "$failure_count"
